<body><main><h1>한컴 문서 작업 목록</h1><p class="note">등록된 파일은 브라우저에서 바로 열립니다. 각 문서를 별도 창에서 편집한 뒤 ‘결과 파일 저장’을 누르세요. 원본은 보존됩니다.</p><button id="refresh">저장 상태 새로고침</button><p id="status" role="status">문서 목록을 읽고 있습니다.</p><section id="documents"></section><p class="note">저장 검증은 편집 엔진으로 파일을 다시 열어 텍스트·형식과 보고된 내용 손실을 확인합니다. 모든 개체의 보존이나 실제 한컴의 글꼴·페이지 배치를 보증하지는 않습니다.</p></main><script type="module" src="/tasks.mjs"></script></body>
